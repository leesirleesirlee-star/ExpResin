<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>ExpResin · PortalJarvis</title>
    <script>
      // 提前应用主题，避免首屏闪烁。
      // 仅当用户显式选择 light/dark 时写 data-theme；'auto' 或无记录时留空，
      // 交给 tokens.css 的 prefers-color-scheme 规则跟随系统。
      try {
        var saved = localStorage.getItem('expresin-theme')
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.dataset.theme = saved
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
